<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticha — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #047857 0%, #059669 50%, #10B981 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      text-align: center;
      color: white;
    }
    .icon { font-size: 72px; margin-bottom: 16px; }
    h1 {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .sw {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      font-style: italic;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    button {
      background: #FF8C00;
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #CC6A00;
      font-family: inherit;
    }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #CC6A00; }
    .logo { width: 120px; margin-bottom: 24px; opacity: 0.95; }
  </style>
</head>
<body>
  <img src="/images/ticha-logo-v2.PNG" alt="Ticha" class="logo" onerror="this.style.display='none'" />
  <div class="icon">📡</div>
  <h1>No Internet Connection</h1>
  <p class="sub">You're offline. Connect to Wi-Fi or mobile data to use Ticha.</p>
  <p class="sw">Huna mtandao. Unganika na Wi-Fi au data ya simu kutumia Ticha.</p>
  <button onclick="window.location.reload()">Try Again · Jaribu Tena</button>
</body>
</html>
